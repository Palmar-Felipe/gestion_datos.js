
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description"
        content="sistema interactivo que permitirá al usuario ingresar datos y recibir mensajes dinámicos de manera estructurada. ">
    <meta name="keywords" content="trabajo-1-de-java-script">
    <meta name="sitedomain" content="https://github.com/Palmar-Felipe">
    <meta name="author" content="Felipe Miguel Palmar Ramirez">
    <meta name="desingner" content="Felipe Miguel Palmar Ramirez">
    <meta name="copyright" content="© Felipe Miguel Palmar Ramirez. All rights reserved">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="revisit-after" content="10days">
    <link rel="stylesheet" href="./src/CSS/styles.css">
    <title>CRUD</title>
  </head>
  <body>
    <header>
      <h1>CRUD Coders</h1>
    </header>

    <main>
      <section>
        <article>
          <label for="firstName">First Name</label>
          <input type="text" id="firstName">
          <br>
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName">
          <br>
          <label for="email">Email</label>
          <input type="email" id="email">
          <br>
          <label for="age">Age</label>
          <input type="number" id="age">
          <br>
          <label for="clan">Clan</label>
          <input type="text" id="clan">
          <br>
          <label for="day">Day</label>
          <input type="text" id="day">

          <button id="registerButton">Register User</button>
        </article>
        <article>
          <h2>Best-Selling Products</h2>
          <nav>
            <li>
              ID: 001, Name: iPhone XS, Price: 3000
            </li>
            <li>
              ID: 002, Name: iPhone XS, Price: 3000
            </li>
            <li>
              ID: 003, Name: Tablet, Price: 4000
            </li>
          </nav>
        </article>
        <article>
          <h2>Add Product</h2>
          <input type="text" id="productId" placeholder="Enter product code">
          <input type="text" id="productName" placeholder="Product name">
          <input type="number" id="productPrice" placeholder="Price">
          <input type="text" id="productCategory" placeholder="Category">
          <button id="addProductButton">Add Product</button>

          <h3>Product List:</h3>
          <ul id="productList"></ul>
        </article>
      </section>
    </main>

    <footer>
      <span>This is a practice project</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./src/JS/gestion_datos.js"></script>
  </body>
</html>
