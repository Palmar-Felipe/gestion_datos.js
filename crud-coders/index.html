

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/CSS/styles.css">
    <title>CRUD</title>
  </head>
  <body>
    <header>
      <h1> CRUDE Coders</h1>
    </header>

    <main>
      <section>
        <article>
          <label for="name">nombre</label>
          <input type="text" id="name">
          <br>
          <label for="lastname">last-nombre</label>
          <input type="text" id="lastname">
          <br>
          <label for="email">mail</label>
          <input type="email" id="email">
          <br>
          <label for="number">age</label>
          <input type="number" id="number">
          <br>
          <label for="clan">clan</label>
          <input type="text" id="clan">
          <br>
          <label for="day">day</label>
          <input type="text" id="day">

          <button id="button" >please, click me </button>
        </article>
          
        <article>
          <h2>Agregar Producto</h2>
          <input type="text"id="ideproducto" placeholder="Ingresa el codigo del producto">
          <input type="text" id="productoNombre" placeholder="Nombre del producto">
          <input type="number" id="productoPrecio" placeholder="Precio">
          <input type="text" id="productoCategoria" placeholder="Categoría">
          <button id="agregarProducto">Agregar</button>

          <h3>Lista de productos:</h3>
          <ul id="listaProductos"></ul>
        </article>
      </section>
      
    </main>

    <footer>
      <span> this is a practice proyect</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./src/JS/gestion_datos.js"></script>
  </body>
</html>
